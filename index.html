<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloak and Lantern</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#0b1a12; --panel:#12261a; --gold:#d9a441; --cream:#f1e6c8; --ink:#2a2118; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--cream); font-family:Georgia,serif; display:flex; flex-direction:column; height:100dvh; }
  h1,h2 { color:var(--gold); font-weight:normal; margin:0; }
  .screen { display:none; flex:1; min-height:0; }
  .screen.on { display:flex; }
  #landing { flex-direction:column; align-items:center; padding:24px 16px; gap:18px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--gold); border-radius:8px; padding:16px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px; }
  input, button { font:inherit; font-size:16px; padding:10px; border-radius:6px; border:1px solid var(--gold); min-height:44px; }
  input { background:#0b1a12; color:var(--cream); }
  button { background:var(--gold); color:var(--ink); cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--gold); }
  button.danger { background:transparent; color:#ff8a80; border-color:#ff8a80; }
  #err { color:#ff8a80; min-height:1.2em; text-align:center; }

  #lobby { flex-direction:column; align-items:center; gap:16px; overflow:auto; padding:24px 16px; padding-top:calc(24px + env(safe-area-inset-top)); padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  #lobby h1 { text-align:center; overflow-wrap:anywhere; }
  #lobby > button { width:100%; max-width:380px; }
  .bigcode { font-size:2.4rem; letter-spacing:.3em; padding-left:.3em; color:var(--gold); text-align:center; }
  #lb-list { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--gold); border-radius:20px; padding:4px 12px; }
  .chip.host { background:var(--gold); color:var(--ink); }
  #lb-host { display:none; flex-direction:column; gap:8px; width:100%; max-width:380px; text-align:center; }
  #lb-wait { display:none; text-align:center; opacity:.85; }

  #side { width:240px; background:var(--panel); border-right:1px solid var(--gold); padding:12px; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  #rooms { display:flex; flex-direction:column; gap:4px; flex:1; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #head { padding:8px 12px; border-bottom:1px solid var(--gold); display:flex; gap:10px; align-items:center; padding-top:calc(8px + env(safe-area-inset-top)); }
  #head h2 { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #menu { display:none; position:relative; padding:6px 12px; }
  #menudot { display:none; position:absolute; top:4px; right:4px; width:10px; height:10px; border-radius:50%; background:#c0392b; }
  #msgs { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .m { background:#f1e6c8; color:var(--ink); border-radius:10px; padding:8px 12px; max-width:85%; align-self:flex-start; overflow-wrap:anywhere; }
  .m.mine { align-self:flex-end; background:#e2c97e; }
  .m b { display:block; font-size:.8em; opacity:.7; }
  #send { display:flex; gap:8px; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--gold); }
  #send input { flex:1; min-width:0; }
  .room { text-align:left; background:transparent; color:var(--cream); border:1px solid transparent; }
  .room.sel { border-color:var(--gold); color:var(--gold); }
  #newroom { display:none; background:var(--bg); border:1px solid var(--gold); border-radius:8px; padding:10px; flex-direction:column; gap:6px; }
  #newroom label { display:flex; align-items:center; gap:8px; min-height:36px; }
  #newroom label input { min-height:0; width:20px; height:20px; }
  #scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; }

  @media (max-width:700px) {
    #menu { display:block; }
    #side { position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; z-index:20; transform:translateX(-100%); transition:transform .2s; padding-top:calc(12px + env(safe-area-inset-top)); padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
    #side.open { transform:none; }
    #scrim.on { display:block; }
  }
</style>
</head>
<body>

<div id="landing" class="screen on">
  <h1>Cloak and Lantern</h1>
  <div id="err"></div>
  <div class="card">
    <h2>Start a new game</h2>
    <input id="cg-name" placeholder="Game name">
    <input id="cg-me" placeholder="Your display name" maxlength="24">
    <button onclick="createGame()">Create game</button>
  </div>
  <div class="card">
    <h2>Join a game</h2>
    <input id="jg-code" placeholder="Join code">
    <input id="jg-me" placeholder="Your display name" maxlength="24">
    <button onclick="joinGame()">Join</button>
  </div>
</div>

<div id="lobby" class="screen">
  <h1 id="lb-name"></h1>
  <div class="card">
    <small>Join code</small>
    <div id="lb-code" class="bigcode"></div>
    <small>Share this code with your players.</small>
  </div>
  <div class="card">
    <h2 id="lb-count"></h2>
    <div id="lb-list"></div>
  </div>
  <div id="lb-host">
    <button id="lb-start" onclick="startGame()">Start the game</button>
    <small id="lb-hint"></small>
  </div>
  <div id="lb-wait">Waiting for the host to start the game&hellip;</div>
  <button class="ghost notifybtn" onclick="toggleNotify()"></button>
  <button class="danger" onclick="leaveGame()">Leave game</button>
</div>

<div id="game" class="screen">
  <div id="scrim" onclick="closeDrawer()"></div>
  <div id="side">
    <h2 id="gname"></h2>
    <small>Join code: <b id="code"></b></small>
    <div id="rooms"></div>
    <button class="ghost" onclick="toggleNewRoom()">+ New private room</button>
    <div id="newroom">
      <input id="nr-name" placeholder="Room name" maxlength="40">
      <div id="nr-players"></div>
      <button onclick="makeRoom()">Create room</button>
    </div>
    <button class="ghost notifybtn" onclick="toggleNotify()"></button>
    <button class="danger" onclick="leaveGame()">Leave game</button>
  </div>
  <div id="main">
    <div id="head">
      <button id="menu" class="ghost" onclick="openDrawer()" aria-label="Rooms">&#9776;<span id="menudot"></span></button>
      <h2 id="rname"></h2>
      <small id="who"></small>
    </div>
    <div id="msgs"></div>
    <form id="send" onsubmit="sendMsg(event)">
      <input id="text" placeholder="Say something..." maxlength="1000" autocomplete="off">
      <button>Send</button>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = "https://kjvgvzreapdrjxtjcpfm.supabase.co";
const SUPABASE_KEY = "sb_publishable_PINxqSLLl1Udzq6krzcrsg_LPsjHe8K";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

// Keep this in sync with the start_game function in the database.
// Testing value. Change both to 6 before playing real games.
const MIN_PLAYERS = 2;
const BASE_TITLE = "Cloak and Lantern";

let userId = null, me = null, game = null, rooms = [], players = {}, current = null, channel = null;
let seen = new Set(), unread = new Set();
let chatStarted = false, missed = 0, actx = null;

function fail(e) { $("err").textContent = (e && e.message) ? e.message : String(e); }
function screen(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on"); }
function openDrawer() { $("side").classList.add("open"); $("scrim").classList.add("on"); }
function closeDrawer() { $("side").classList.remove("open"); $("scrim").classList.remove("on"); }

/* ---------- Notifications ---------- */
function notifySupported() { return "Notification" in window; }
function notifyOn() {
  try { return localStorage.getItem("cl_notify") === "1" && notifySupported() && Notification.permission === "granted"; }
  catch (e) { return false; }
}
function updateNotifyUI() {
  const label = notifyOn() ? "Notifications: on (tap to turn off)" : "Turn on notifications";
  document.querySelectorAll(".notifybtn").forEach(b => b.textContent = label);
}
async function toggleNotify() {
  if (!notifySupported()) {
    alert("This browser can't show notifications here. On an iPhone, open the game in Safari, tap Share, choose Add to Home Screen, then open it from the Home Screen.");
    return;
  }
  if (notifyOn()) {
    try { localStorage.setItem("cl_notify", "0"); } catch (e) {}
    updateNotifyUI();
    return;
  }
  const perm = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  if (perm !== "granted") {
    alert("Notifications are blocked for this site. You can allow them in your browser's site settings.");
    updateNotifyUI();
    return;
  }
  try { localStorage.setItem("cl_notify", "1"); } catch (e) {}
  ping();
  updateNotifyUI();
}
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function ping() {
  try {
    unlockAudio();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = "sine"; o.frequency.value = 660;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.5);
  } catch (e) {}
}
function alertUser(title, body, tag) {
  if (!notifyOn()) return;
  ping();
  if (!document.hidden) return;
  const opts = { body, tag, renotify: true };
  const fallback = () => { try { new Notification(title, { body, tag }); } catch (e) {} };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
    navigator.serviceWorker.getRegistration().then(reg => reg ? reg.showNotification(title, opts) : fallback()).catch(fallback);
  } else fallback();
}
document.addEventListener("pointerdown", unlockAudio);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { missed = 0; document.title = BASE_TITLE; }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
updateNotifyUI();

/* ---------- Sign in and entering a game ---------- */
async function start() {
  let { data } = await db.auth.getSession();
  if (!data.session) {
    const r = await db.auth.signInAnonymously();
    if (r.error) return fail(r.error);
    data = r.data;
  }
  userId = data.session.user.id;
  const { data: mine, error } = await db.from("players").select("*").eq("user_id", userId).limit(1);
  if (error) return fail(error);
  if (mine.length) enterGame(mine[0]);
}

async function createGame() {
  $("err").textContent = "";
  const { error } = await db.rpc("create_game", { p_name: $("cg-name").value, p_display_name: $("cg-me").value });
  if (error) return fail(error);
  start();
}

async function joinGame() {
  $("err").textContent = "";
  const { error } = await db.rpc("join_game", { p_code: $("jg-code").value, p_display_name: $("jg-me").value });
  if (error) return fail(error);
  start();
}

async function leaveGame() {
  if (!confirm("Leave this game? You will lose your place and your messages will be removed.")) return;
  const { error } = await db.rpc("leave_game", { p_game: game.id });
  if (error) return alert(error.message);
  if (channel) await db.removeChannel(channel);
  channel = null; me = null; game = null; rooms = []; players = {}; current = null;
  unread = new Set(); seen = new Set(); chatStarted = false; missed = 0;
  document.title = BASE_TITLE;
  $("msgs").innerHTML = "";
  $("err").textContent = "";
  closeDrawer();
  screen("landing");
}

async function enterGame(p) {
  me = p;
  const { data: g } = await db.from("games").select("*").eq("id", p.game_id).single();
  game = g;
  $("gname").textContent = g.name;
  $("code").textContent = g.join_code;
  $("who").textContent = p.display_name;
  await loadPlayers();
  subscribe();
  updateNotifyUI();
  if (game.status === "lobby") {
    chatStarted = false;
    screen("lobby");
    renderLobby();
  } else {
    await beginChat();
  }
}

async function beginChat() {
  chatStarted = true;
  screen("game");
  await loadRooms();
  const hall = rooms.find(r => r.kind === "hall");
  if (hall) openRoom(hall.id);
}

/* ---------- Lobby ---------- */
function renderLobby() {
  if (!game) return;
  const list = Object.values(players).sort((a, b) => new Date(a.joined_at) - new Date(b.joined_at));
  $("lb-name").textContent = game.name;
  $("lb-code").textContent = game.join_code;
  $("lb-count").textContent = list.length === 1 ? "1 player has joined" : list.length + " players have joined";
  const box = $("lb-list");
  box.innerHTML = "";
  list.forEach(p => {
    const c = document.createElement("span");
    const isHost = p.user_id === game.host_id;
    c.className = "chip" + (isHost ? " host" : "");
    c.textContent = p.display_name + (isHost ? " (host)" : "");
    box.appendChild(c);
  });
  const iAmHost = game.host_id === userId;
  $("lb-host").style.display = iAmHost ? "flex" : "none";
  $("lb-wait").style.display = iAmHost ? "none" : "block";
  const enough = list.length >= MIN_PLAYERS;
  $("lb-start").disabled = !enough;
  $("lb-hint").textContent = enough ? "" : "Waiting for at least " + MIN_PLAYERS + " players (" + list.length + " so far).";
}

async function startGame() {
  $("lb-start").disabled = true;
  const { error } = await db.rpc("start_game", { p_game: game.id });
  if (error) { alert(error.message); renderLobby(); return; }
  const { data: g } = await db.from("games").select("*").eq("id", game.id).single();
  if (g) onGameUpdate(g);
}

function onGameUpdate(g) {
  game = g;
  if (chatStarted) return;
  if (g.status !== "lobby") beginChat();
  else renderLobby();
}

/* ---------- Data loading ---------- */
async function loadPlayers() {
  const { data } = await db.from("players").select("*").eq("game_id", game.id);
  players = {};
  (data || []).forEach(p => players[p.id] = p);
}

async function loadRooms() {
  if (!game) return;
  const { data } = await db.from("rooms").select("*").eq("game_id", game.id).order("created_at");
  rooms = data || [];
  const box = $("rooms");
  box.innerHTML = "";
  rooms.forEach(r => {
    const b = document.createElement("button");
    b.className = "room" + (r.id === current ? " sel" : "");
    b.textContent = (r.kind === "hall" ? "The Hall" : r.name) + (unread.has(r.id) ? " \u2022" : "");
    b.onclick = () => openRoom(r.id);
    box.appendChild(b);
  });
  $("menudot").style.display = unread.size ? "block" : "none";
}

async function openRoom(id) {
  current = id;
  unread.delete(id);
  closeDrawer();
  const room = rooms.find(r => r.id === id);
  $("rname").textContent = room.kind === "hall" ? "The Hall" : room.name;
  loadRooms();
  const { data } = await db.from("messages").select("*").eq("room_id", id).order("created_at").limit(200);
  $("msgs").innerHTML = "";
  seen = new Set();
  (data || []).forEach(addMessage);
}

function addMessage(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const d = document.createElement("div");
  d.className = "m" + (m.player_id === me.id ? " mine" : "");
  const n = document.createElement("b");
  n.textContent = players[m.player_id] ? players[m.player_id].display_name : "Unknown";
  const t = document.createElement("span");
  t.textContent = m.body;
  d.appendChild(n); d.appendChild(t);
  const box = $("msgs");
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(e) {
  e.preventDefault();
  const body = $("text").value.trim();
  if (!body) return;
  $("text").value = "";
  const { error } = await db.from("messages").insert({ room_id: current, player_id: me.id, body });
  if (error) alert(error.message);
}

function subscribe() {
  channel = db.channel("cloak-and-lantern")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async p => {
      const m = p.new;
      if (!players[m.player_id]) await loadPlayers();
      if (!rooms.find(r => r.id === m.room_id)) await loadRooms();
      if (m.room_id === current) addMessage(m);
      else { unread.add(m.room_id); loadRooms(); }
      const mine = me && m.player_id === me.id;
      if (!mine && (document.hidden || m.room_id !== current)) {
        if (document.hidden) { missed++; document.title = "(" + missed + ") " + BASE_TITLE; }
        const r = rooms.find(x => x.id === m.room_id);
        const roomName = r ? (r.kind === "hall" ? "The Hall" : r.name) : "a room";
        const who = players[m.player_id] ? players[m.player_id].display_name : "Someone";
        alertUser(who + " in " + roomName, String(m.body).slice(0, 120), m.room_id);
      }
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "games" }, p => {
      if (!game || p.new.id !== game.id) return;
      const wasLobby = game.status === "lobby";
      onGameUpdate(p.new);
      if (wasLobby && p.new.status !== "lobby") alertUser("The game has begun", "Step into the Hall.", "start");
    })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "room_members" }, () => loadRooms())
    .on("postgres_changes", { event: "*", schema: "public", table: "players" }, () => {
      loadPlayers().then(() => { if (!chatStarted) renderLobby(); });
    })
    .subscribe();
}

function toggleNewRoom() {
  const box = $("newroom");
  if (box.style.display === "flex") { box.style.display = "none"; return; }
  const list = $("nr-players");
  list.innerHTML = "";
  Object.values(players).filter(p => p.id !== me.id).forEach(p => {
    const l = document.createElement("label");
    const c = document.createElement("input");
    c.type = "checkbox"; c.value = p.id;
    l.appendChild(c);
    l.appendChild(document.createTextNode(p.display_name));
    list.appendChild(l);
  });
  box.style.display = "flex";
}

async function makeRoom() {
  const ids = [...document.querySelectorAll("#nr-players input:checked")].map(c => c.value);
  const name = $("nr-name").value.trim() || "Private room";
  const { data, error } = await db.rpc("create_private_room", { p_game: game.id, p_name: name, p_members: ids });
  if (error) return alert(error.message);
  $("newroom").style.display = "none";
  $("nr-name").value = "";
  await loadRooms();
  openRoom(data);
}

start();
</script>
</body>
</html>
